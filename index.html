on:column;justify-content:center}.hero h1{background:linear-gradient(#fff,#9da0aa);background-clip:text;color:transparent}.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.fighter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}.art{min-height:430px;border-radius:12px;background:radial-gradient(circle at 50% 45%,#793443,#161923 65%);overflow:hidden;display:flex;justify-content:center;align-items:center;position:relative}.art.kai{background:radial-gradient(circle at 50% 45%,#874923,#17181c 65%)}.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.art .fallback{font-size:125px;font-family:Impact;color:#ffffff18}.choices button,.moves button{border:1px solid #55515c;background:#232631;color:white;border-radius:8px;padding:13px;font-weight:700}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.choices button.on{border-color:var(--gold);color:var(--gold)}.moves{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.meter{height:10px;background:#373841;border-radius:50px;overflow:hidden;margin:14px 0}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .2s}.poster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}.poster-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#252832;border:1px solid #555;border-radius:7px}.poster-grid small{display:block;color:var(--muted);font-size:10px}.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.roster .card{text-align:center;padding:14px;font-weight:700;font-size:12px}.note{color:var(--muted);font-size:13px}.join button{display:block;width:100%;text-align:left;margin:10px 0}.feedback{margin-top:15px;padding:16px;border:1px solid var(--gold);border-radius:8px;color:#f0d5ae;min-height:65px} @media(max-width:660px){header{padding:10px 15px}.fighter{grid-template-columns:1fr}.art{min-height:370px}.duo{grid-template-columns:1fr}.page{padding-top:35px}.poster-grid{gap:6px}}

html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{min-height:44px}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:hover{filter:brightness(1.15)}button:active{transform:translateY(1px)}header{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(15px,env(safe-area-inset-left));padding-right:max(15px,env(safe-area-inset-right))}.langs{flex-shrink:0}.nav{padding-bottom:calc(9px + env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.nav button{min-width:0;padding:10px 4px;font-size:clamp(9px,2.5vw,12px)}.page{padding-bottom:calc(110px + env(safe-area-inset-bottom));outline:none}.page.on{animation:reveal .3s ease-out}.hero{min-height:65vh;min-height:65svh}.hero h1{-webkit-background-clip:text}.fighter>*{min-width:0}.art,.art.kai{min-height:0;background:#101116;aspect-ratio:3/4;align-self:start}.art.kai{aspect-ratio:591/887}.art img{object-fit:contain}.fighter .card h2{font-size:clamp(40px,7vw,68px);overflow-wrap:anywhere}.fighter .card>.tag:not(:first-child){margin-top:18px}.moves{margin-top:12px}.moves button{font-size:12px;min-height:58px;overflow-wrap:anywhere}.moves .finisher{border-color:var(--gold);color:var(--gold)}.moves .ready{background:#483322;box-shadow:0 0 22px #e6aa6333}.poster-grid button{border:0;background:transparent;padding:0;color:inherit;text-align:left}.poster-grid img{object-fit:contain;aspect-ratio:2/3;background:#101116}.poster-grid small{font-size:11px;margin-top:5px}.choices button.on{background:#352c29}.card.selected{border-color:var(--gold)}.note{line-height:1.6}dialog{width:min(94vw,850px);max-height:90vh;max-height:90dvh;padding:12px;background:#101116;color:var(--fg);border:1px solid var(--gold);border-radius:12px}dialog::backdrop{background:#05060aed}dialog img{display:block;max-width:100%;max-height:70vh;max-height:70dvh;margin:auto;object-fit:contain}.gallery-controls{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}.gallery-controls button{padding:10px 15px;color:var(--fg);background:#252832;border:1px solid #555;border-radius:6px}#galleryCaption{text-align:center;font-size:12px;color:var(--gold)}.art.hit{animation:impact .4s ease-out}.art.finish{animation:finisher .7s ease-out}.meter{margin-bottom:6px}.fighter .card{align-self:start}.share-fallback{display:block;overflow-wrap:anywhere;color:var(--gold)}@keyframes reveal{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes impact{50%{box-shadow:0 0 26px #e9405077;transform:scale(.99)}}@keyframes finisher{50%{box-shadow:0 0 40px #e6aa6399;filter:brightness(1.25)}}@media(max-width:660px){.art{min-height:0;max-height:none}.page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}.fighter .card{padding:18px}.poster-grid{gap:8px}.logo{font-size:clamp(20px,5.5vw,28px)}.langs button{padding:8px}.page h2{overflow-wrap:anywhere}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><header><div class="logo">SHATTER<span>BOUND</span></div><div class="langs"><button id="en" class="on" aria-label="English" aria-pressed="true" onclick="language('en')">EN</button><button id="es" aria-label="Español de México" aria-pressed="false" onclick="language('es')">ES 🇲🇽</button></div></header>
<main>
<section id="home" tabindex="-1" class="page on"><div class="hero"><div class="tag" data-en="ORIGINAL FIGHTING GAME · CONCEPT REVEAL" data-es="VIDEOJUEGO DE PELEAS ORIGINAL · PRIMER VISTAZO"></div><h1>SHATTER<br>BOUND</h1><div class="lead" data-en="24 warriors. One broken world. No limits." data-es="24 guerreros. Un mundo fracturado. Sin límites."></div><p data-en="Martial arts meet supernatural powers in a cinematic 2.5D fighting game for iPhone." data-es="Las artes marciales se combinan con poderes sobrenaturales en un videojuego de peleas cinematográfico en 2.5D para iPhone."></p><p><button class="btn" onclick="go('story')" data-en="ENTER THE SHATTERING →" data-es="ENTRA A LA FRACTURA →"></button></p></div></section>
<section id="story" tabindex="-1" class="page"><div class="tag" data-en="THE STORY" data-es="LA HISTORIA"></div><h2 data-en="THE VEIL HAS BROKEN" data-es="EL VELO SE HA ROTO"></h2><p class="lead" data-en="A dimensional barrier separating our world from supernatural energy has fractured. Twenty-four fighters awaken extraordinary abilities." data-es="Una barrera dimensional que separaba nuestro mundo de la energía sobrenatural se ha fracturado. Veinticuatro peleadores despiertan habilidades extraordinarias."></p><div class="grid"><div class="card"><h3 data-en="THE VEIL" data-es="EL VELO"></h3><p data-en="An ancient boundary between worlds. Now its power is leaking into reality." data-es="Una antigua barrera entre mundos. Ahora su poder se está filtrando a nuestra realidad."></p></div><div class="card"><h3 data-en="THE DOMINION" data-es="EL DOMINION"></h3><p data-en="A mysterious organization recruits fighters to a tournament—but each battle brings the worlds closer to collision." data-es="Una organización misteriosa recluta peleadores para un torneo, pero cada combate acerca más a los mundos a una colisión."></p></div><div class="card"><h3 data-en="THE SHATTERING" data-es="LA FRACTURA"></h3><p data-en="A global tournament. Personal rivalries. A final battle for the fate of reality." data-es="Un torneo mundial. Rivalidades personales. Una batalla final por el destino de la realidad."></p></div></div><button class="btn" onclick="go('fighters')" data-en="MEET THE FIGHTERS →" data-es="CONOCE A LOS PELEADORES →"></button></section>
<section id="fighters" tabindex="-1" class="page"><div class="tag" data-en="CHARACTER SELECT" data-es="ELIGE A TU PELEADOR"></div><h2 data-en="CHOOSE YOUR FIGHTER" data-es="ELIGE A TU PELEADOR"></h2><div class="choices"><button id="jb" class="on" onclick="fighter('jace')">JACE COLTON 🇺🇸</button><button id="kb" onclick="fighter('kai')">KAI SURIYA 🇹🇭</button></div><div class="fighter"><div class="art" id="fighterArt"><img id="portrait" src="jace_hero.webp" alt="Jace Colton — full-body character poster" width="1086" height="1448" decoding="async"></div><div class="card"><div class="tag" id="nation"></div><h2 id="name"></h2><div class="tag" id="style"></div><p id="bio"></p><div class="tag" data-en="SUPERNATURAL POWER" data-es="PODER SOBRENATURAL"></div><h3 id="power"></h3><div class="tag" data-en="TAP TO TRY ABILITIES" data-es="TOCA PARA PROBAR LAS HABILIDADES"></div><div class="moves" id="moves"></div><div class="meter" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><div id="message" class="note" role="status" aria-live="polite"></div></div></div><h3 data-en="CHARACTER POSTERS" data-es="PÓSTERS DEL PERSONAJE"></h3><div class="poster-grid" id="posters"></div><p class="note" data-en="Interactive ability previews are illustrative, not playable combat." data-es="Las habilidades interactivas son demostrativas; todavía no es un combate jugable."></p></section>
<section id="world" tabindex="-1" class="page"><div class="tag" data-en="WORLD ROSTER" data-es="PLANTEL MUNDIAL"></div><h2 data-en="24 FIGHTERS. 1 WORLD." data-es="24 PELEADORES. 1 MUNDO."></h2><p class="lead" data-en="Jace and Kai are the first two designed characters. Twenty-two more fighters are planned, each with their own martial art, story, and supernatural ability." data-es="Jace y Kai son los primeros dos personajes diseñados. Hay otros veintidós peleadores planeados, cada uno con su arte marcial, historia y poder sobrenatural."></p><div class="roster" id="roster"></div><p><button class="btn" onclick="go('join')" data-en="HELP BUILD IT →" data-es="AYÚDANOS A CREARLO →"></button></p></section>
<section id="join" tabindex="-1" class="page join"><div class="tag" data-en="YOU'RE INVITED" data-es="ESTÁS INVITADO"></div><h2 data-en="DANNY, WANT TO HELP MAKE THIS?" data-es="DANNY, ¿TE ANIMAS A CREARLO CON NOSOTROS?"></h2><p class="lead" data-en="We're just starting. The goal is to build the first playable fight: Jace versus Kai. You could be part of the team from the beginning." data-es="Apenas estamos empezando. La meta es crear la primera pelea jugable: Jace contra Kai. ¡Podrías ser parte del equipo desde el principio!"></p><div class="choices" style="display:block"><button onclick="chooseRole('test')" data-en="🎮 PLAYTEST — Tell us what feels fun" data-es="🎮 PROBAR — Dinos qué está divertido"></button><button onclick="chooseRole('ideas')" data-en="⚡ IDEAS — Invent powers and combos" data-es="⚡ IDEAS — Inventar poderes y combos"></button><button onclick="chooseRole('art')" data-en="🎨 CREATIVE — Help design fighters and arenas" data-es="🎨 CREATIVIDAD — Diseñar peleadores y arenas"></button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><p><button class="btn" onclick="share()" data-en="SHARE MY CHOICE ↗" data-es="COMPARTIR MI ELECCIÓN ↗"></button></p></section>
</main><nav class="nav" aria-label="Main navigation"><button onclick="go('home')" data-en="HOME" data-es="INICIO"></button><button onclick="go('story')" data-en="STORY" data-es="HISTORIA"></button><button onclick="go('fighters')" data-en="FIGHTERS" data-es="PELEADORES"></button><button onclick="go('world')" data-en="ROSTER" data-es="PLANTEL"></button><button onclick="go('join')" data-en="JOIN" data-es="UNIRME"></button></nav>
<dialog id="gallery" aria-labelledby="galleryCaption"><div class="gallery-controls"><button id="galleryClose" onclick="document.getElementById('gallery').close()">Close ✕</button></div><img id="galleryImage" alt=""><p id="galleryCaption"></p><div class="gallery-controls"><button id="galleryPrev" onclick="nextPoster(-1)">← Previous</button><button id="galleryNext" onclick="nextPoster(1)">Next →</button></div></dialog>
<script>
let lang='en',who='jace',energy=0,choice='';const F={jace:{name:'JACE COLTON',country:['UNITED STATES','ESTADOS UNIDOS'],style:'MMA / DUTCH KICKBOXING / KRAV MAGA / WEIGHTLIFTING',bio:['An elite American MMA fighter and competitive weightlifter. A mysterious energy surge gave him the ability to amplify kinetic force. He enters the tournament to expose the Dominion.','Peleador estadounidense de MMA y levantador de pesas competitivo. Una descarga misteriosa le dio el poder de amplificar la energía cinética. Entra al torneo para desenmascarar al Dominion.'],power:['KINETIC OVERDRIVE','SOBRECARGA CINÉTICA'],moves:['IRON BARRAGE','SHOCKSTEP','TITAN PRESS'],fin:'GRAVITY BREAK',images:['jace_hero.webp','jace_action.webp','jace_close.webp']},kai:{name:'KAI SURIYA',country:['THAILAND','TAILANDIA'],style:'MUAY THAI / LETHWEI / BJJ',bio:['A Muay Thai fighter from Chiang Mai searching for his missing brother. Fire awakened inside him when the Veil fractured. His most powerful attack summons a blazing phoenix.','Peleador de Muay Thai de Chiang Mai que busca a su hermano desaparecido. El fuego despertó en su interior cuando el Velo se fracturó. Su ataque definitivo invoca un fénix ardiente.'],power:['FIRE MANIPULATION','CONTROL DEL FUEGO'],moves:['DRAGON ELBOW','INFERNO KNEE','PHOENIX RUSH'],fin:'PHOENIX JUDGMENT',images:['kai_hero.webp','kai_action.webp','kai_close.webp']}};
const names=['Mateus Silva','Jack Cross','Yumi Kage','Amara Okafor','Lukas Voss','Sofía Reyes','Arjun Rana','Elena Volkova','Li Wei','Zuri Ndlovu','Dante Rossi','Min-Ji Park','Rafael Costa','Nadia El-Masri','Erik Storm','Aisha Haddad','Tane Rangi','Isabel Cruz','Malik Dubois','Camila Torres','Hanna Björk','The Warden'];
const esMoves={jace:['RÁFAGA DE HIERRO','PASO DE IMPACTO','PRESIÓN TITÁNICA'],kai:['CODO DEL DRAGÓN','RODILLA INFERNAL','EMBESTIDA DEL FÉNIX']};
const esFinish={jace:'RUPTURA DE GRAVEDAD',kai:'JUICIO DEL FÉNIX'};
const roles={test:['I want to playtest the game!','¡Quiero probar el juego!'],ideas:['I want to help invent powers and combos!','¡Quiero inventar poderes y combos!'],art:['I want to help design characters and arenas!','¡Quiero diseñar personajes y arenas!']};
const captions={en:['FULL-BODY','FIGHT SCENE','CLOSE-UP'],es:['CUERPO COMPLETO','EN COMBATE','PRIMER PLANO']};
const pages=['home','story','fighters','world','join'];
let currentPage='home',galleryIndex=0,lastAttack=null;
const $=id=>document.getElementById(id);
const tr=(en,es)=>lang==='es'?es:en;
function moveName(i){return lang==='es'?esMoves[who][i]:F[who].moves[i]}
function finName(){return lang==='es'?esFinish[who]:F[who].fin}
function language(l){
 lang=l==='es'?'es':'en';document.documentElement.lang=lang==='es'?'es-MX':'en';
 try{localStorage.setItem('shatterbound-language',lang)}catch(e){}
 document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);
 ['en','es'].forEach(code=>{$(code).classList.toggle('on',lang===code);$(code).setAttribute('aria-pressed',String(lang===code))});
 document.querySelector('.nav').setAttribute('aria-label',tr('Main navigation','Navegación principal'));
 render();renderRole();renderRoster();if($('gallery').open)renderGallery();
}
function showPage(id,focus=false){
 currentPage=pages.includes(id)?id:'home';
 document.querySelectorAll('.page').forEach(x=>{const active=x.id===currentPage;x.classList.toggle('on',active);x.setAttribute('aria-hidden',String(!active))});
 document.querySelectorAll('.nav button').forEach((b,i)=>{const active=pages[i]===currentPage;b.classList.toggle('on',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 window.scrollTo(0,0);if(focus)$(currentPage).focus({preventScroll:true});
}
function go(id){if(!pages.includes(id))return;showPage(id,true);if(location.hash!=='#'+id)history.pushState(null,'','#'+id)}
window.addEventListener('popstate',()=>showPage(location.hash.slice(1),true));
window.addEventListener('hashchange',()=>showPage(location.hash.slice(1),true));
function fighter(f){if(!F[f])return;who=f;energy=0;lastAttack=null;render()}
function render(){
 const f=F[who],idx=lang==='es'?1:0;
 ['jace','kai'].forEach(key=>{const b=$(key==='jace'?'jb':'kb');b.classList.toggle('on',key===who);b.setAttribute('aria-pressed',String(key===who))});
 $('name').textContent=f.name;$('nation').textContent=f.country[idx];
 $('style').textContent=who==='jace'?tr(f.style,'MMA / KICKBOXING HOLANDÉS / KRAV MAGA / LEVANTAMIENTO DE PESAS'):f.style;
 $('bio').textContent=f.bio[idx];$('power').textContent=f.power[idx];$('fighterArt').classList.toggle('kai',who==='kai');
 setPortrait(lastAttack===null?0:1);
 $('moves').innerHTML=f.moves.map((m,i)=>'<button onclick="attack('+i+')">'+moveName(i)+'</button>').join('')+'<button class="finisher" onclick="finish()">★ '+finName()+'</button>';
 updateMeter();renderMessage();
 $('posters').innerHTML=f.images.map((x,i)=>'<button onclick="openPoster('+i+')" aria-label="'+tr('View ','Ver ')+f.name+' — '+captions[lang][i]+'"><img src="'+x+'" loading="lazy" decoding="async" width="'+(who==='jace'?1086:(i===1?592:591))+'" height="'+(who==='jace'?1448:887)+'" alt="'+f.name+' — '+captions[lang][i]+'"><small>'+captions[lang][i]+' ↗</small></button>').join('');
}
function setPortrait(i){const p=$('portrait');const src=F[who].images[i];if(p.getAttribute('src')!==src)p.src=src;p.alt=F[who].name+' — '+captions[lang][i];p.width=who==='jace'?1086:591;p.height=who==='jace'?1448:887}
function updateMeter(){
 $('fill').style.width=energy+'%';const meter=document.querySelector('.meter');meter.setAttribute('aria-valuenow',String(energy));meter.setAttribute('aria-label',tr('Energy','Energía'));
 const b=document.querySelector('.finisher');b.classList.toggle('ready',energy===100);b.setAttribute('aria-label',finName()+' — '+tr(energy===100?'ready':'charge energy first',energy===100?'listo':'primero carga tu energía'));
}
function renderMessage(){
 let text=tr('Tap abilities to charge your energy.','Toca las habilidades para llenar tu energía.');
 if(lastAttack==='blocked')text=tr('Charge the meter first!','¡Carga la barra primero!');
 else if(lastAttack==='finish')text='★ '+finName()+'!';
 else if(Number.isInteger(lastAttack))text=moveName(lastAttack)+' · '+(energy===100?tr('FINISHER READY!','¡REMATE LISTO!'):energy+'%');
 $('message').textContent=text;
}
function animateArt(kind){const art=$('fighterArt');art.classList.remove('hit','finish');void art.offsetWidth;art.classList.add(kind)}
function attack(i){energy=Math.min(100,energy+34);lastAttack=i;setPortrait(1);updateMeter();renderMessage();animateArt('hit')}
function finish(){if(energy<100){lastAttack='blocked';renderMessage();return}energy=0;lastAttack='finish';setPortrait(1);updateMeter();renderMessage();animateArt('finish')}
function renderRole(){
 $('feedback').textContent=choice?roles[choice][lang==='es'?1:0]:tr('Choose what sounds most fun. No experience needed.','Elige la parte que más te emocione. No necesitas experiencia.');
 document.querySelectorAll('.join .choices button').forEach((b,i)=>{const selected=['test','ideas','art'][i]===choice;b.classList.toggle('on',selected);b.setAttribute('aria-pressed',String(selected))});
}
function chooseRole(c){if(!roles[c])return;choice=c;renderRole()}
async function share(){
 if(!choice){$('feedback').textContent=tr('Choose a role above, then share it with Josh.','Elige una opción arriba y compártela con Josh.');return}
 const t=roles[choice][lang==='es'?1:0],url=location.href.split('#')[0]+'#join';
 if(navigator.share){try{await navigator.share({title:'SHATTERBOUND',text:t,url});return}catch(e){if(e.name==='AbortError')return}}
 try{if(!navigator.clipboard)throw new Error('unavailable');await navigator.clipboard.writeText(t+' '+url);$('feedback').textContent=tr('Copied! Paste it in WhatsApp.','¡Copiado! Pégalo en WhatsApp.')}catch(e){
 $('feedback').textContent=tr('Copy this message and link: ','Copia este mensaje y enlace: ')+t+' ';const a=document.createElement('a');a.href=url;a.textContent=url;a.className='share-fallback';$('feedback').append(a);
 }
}
function renderRoster(){
 $('roster').innerHTML=['Jace Colton','Kai Suriya',...names].map((n,i)=>i<2?'<button class="card selected" onclick="fighter(\''+(i===0?'jace':'kai')+'\');go(\'fighters\')">'+n+'<br><span class="tag">'+tr('REVEALED','REVELADO')+'</span></button>':'<div class="card">◇<br>'+n+'<br><span style="color:#ae9b8b;font-size:10px">'+tr('COMING SOON','PRÓXIMAMENTE')+'</span></div>').join('');
}
function openPoster(i){galleryIndex=i;renderGallery();$('gallery').showModal()}
function renderGallery(){
 $('galleryImage').src=F[who].images[galleryIndex];$('galleryImage').alt=F[who].name+' — '+captions[lang][galleryIndex];$('galleryCaption').textContent=F[who].name+' · '+captions[lang][galleryIndex]+' · '+(galleryIndex+1)+'/3';
 $('galleryPrev').textContent=tr('← Previous','← Anterior');$('galleryNext').textContent=tr('Next →','Siguiente →');$('galleryClose').textContent=tr('Close ✕','Cerrar ✕');
}
function nextPoster(step){galleryIndex=(galleryIndex+step+3)%3;renderGallery()}
$('gallery').addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextPoster(1);if(e.key==='ArrowLeft')nextPoster(-1)});
let saved='en';try{saved=localStorage.getItem('shatterbound-language')||'en'}catch(e){}
language(saved);showPage(location.hash.slice(1));
