<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d14"><title>SHATTERBOUND — Danny's Reveal</title><style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#0b0d14;--fg:#f5f2ed;--muted:#abb0bd;--line:#353642;--red:#e94050;--gold:#e6aa63}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#3b1825,transparent 50%),var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;background:#10121cF5;border-bottom:1px solid var(--line);padding:12px 4vw;gap:12px}h1,h2,h3,.logo{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;line-height:1;letter-spacing:.02em}.logo{font-size:clamp(22px,5vw,33px);font-style:italic;font-weight:900;text-shadow:3px 3px #8c2534}.logo span{color:var(--red)}h1{font-size:clamp(65px,16vw,145px);margin:8px 0}h2{font-size:clamp(43px,9vw,75px);margin:7px 0 18px}h3{font-size:29px;margin:4px 0}p{color:#c9c9d1}button{cursor:pointer;font:inherit}.langs,.nav{display:flex;gap:5px}.langs button,.nav button{background:#212432;color:#fff;border:1px solid #454653;border-radius:8px;padding:10px;font-size:12px;font-weight:700}.langs .on,.nav .on{background:var(--gold);color:#161016}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;justify-content:center;padding:9px;background:#11131aee;border-top:1px solid var(--line)}.nav button{flex:1;max-width:170px}.page{display:none;max-width:1100px;margin:auto;padding:50px 20px 110px;min-height:75vh}.page.on{display:block}.tag{font-size:12px;color:var(--gold);letter-spacing:.17em;font-weight:800;text-transform:uppercase}.lead{font-size:clamp(18px,3vw,23px);max-width:720px;color:#d6d2d2}.btn{background:var(--red);border:0;color:white;border-radius:7px;padding:15px 24px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.card{background:linear-gradient(135deg,#232530,#14161d);border:1px solid #49434a;border-radius:13px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin:24px 0}.hero{min-height:65vh;display:flex;flex-direction:column;justify-content:center}.hero h1{background:linear-gradient(#fff,#9da0aa);background-clip:text;color:transparent}.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.fighter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}.art{min-height:430px;border-radius:12px;background:radial-gradient(circle at 50% 45%,#793443,#161923 65%);overflow:hidden;display:flex;justify-content:center;align-items:center;position:relative}.art.kai{background:radial-gradient(circle at 50% 45%,#874923,#17181c 65%)}.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.art .fallback{font-size:125px;font-family:Impact;color:#ffffff18}.choices button,.moves button{border:1px solid #55515c;background:#232631;color:white;border-radius:8px;padding:13px;font-weight:700}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.choices button.on{border-color:var(--gold);color:var(--gold)}.moves{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.meter{height:10px;background:#373841;border-radius:50px;overflow:hidden;margin:14px 0}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .2s}.poster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}.poster-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#252832;border:1px solid #555;border-radius:7px}.poster-grid small{display:block;color:var(--muted);font-size:10px}.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.roster .card{text-align:center;padding:14px;font-weight:700;font-size:12px}.note{color:var(--muted);font-size:13px}.join button{display:block;width:100%;text-align:left;margin:10px 0}.feedback{margin-top:15px;padding:16px;border:1px solid var(--gold);border-radius:8px;color:#f0d5ae;min-height:65px} @media(max-width:660px){header{padding:10px 15px}.fighter{grid-template-columns:1fr}.art{min-height:370px}.duo{grid-template-columns:1fr}.page{padding-top:35px}.poster-grid{gap:6px}}
</style></head><body><header><div class="logo">SHATTER<span>BOUND</span></div><div class="langs"><button id="en" class="on" onclick="language('en')">EN</button><button id="es" onclick="language('es')">ES 🇲🇽</button></div></header>
<main>
<section id="home" class="page on"><div class="hero"><div class="tag" data-en="ORIGINAL FIGHTING GAME · CONCEPT REVEAL" data-es="VIDEOJUEGO DE PELEAS ORIGINAL · PRIMER VISTAZO"></div><h1>SHATTER<br>BOUND</h1><div class="lead" data-en="24 warriors. One broken world. No limits." data-es="24 guerreros. Un mundo fracturado. Sin límites."></div><p data-en="Martial arts meet supernatural powers in a cinematic 2.5D fighting game for iPhone." data-es="Las artes marciales se combinan con poderes sobrenaturales en un videojuego de peleas cinematográfico en 2.5D para iPhone."></p><p><button class="btn" onclick="go('story')" data-en="ENTER THE SHATTERING →" data-es="ENTRA AL SHATTERING →"></button></p></div></section>
<section id="story" class="page"><div class="tag" data-en="THE STORY" data-es="LA HISTORIA"></div><h2 data-en="THE VEIL HAS BROKEN" data-es="EL VELO SE HA ROTO"></h2><p class="lead" data-en="A dimensional barrier separating our world from supernatural energy has fractured. Twenty-four fighters awaken extraordinary abilities." data-es="Una barrera dimensional que separaba nuestro mundo de la energía sobrenatural se ha fracturado. Veinticuatro peleadores despiertan habilidades extraordinarias."></p><div class="grid"><div class="card"><h3 data-en="THE VEIL" data-es="EL VELO"></h3><p data-en="An ancient boundary between worlds. Now its power is leaking into reality." data-es="Una antigua barrera entre mundos. Ahora su poder se está filtrando a nuestra realidad."></p></div><div class="card"><h3>THE DOMINION</h3><p data-en="A mysterious organization recruits fighters to a tournament—but each battle brings the worlds closer to collision." data-es="Una organización misteriosa recluta peleadores para un torneo, pero cada combate acerca más a los mundos a una colisión."></p></div><div class="card"><h3>THE SHATTERING</h3><p data-en="A global tournament. Personal rivalries. A final battle for the fate of reality." data-es="Un torneo mundial. Rivalidades personales. Una batalla final por el destino de la realidad."></p></div></div><button class="btn" onclick="go('fighters')" data-en="MEET THE FIGHTERS →" data-es="CONOCE A LOS PELEADORES →"></button></section>
<section id="fighters" class="page"><div class="tag" data-en="CHARACTER SELECT" data-es="ELIGE A TU PELEADOR"></div><h2 data-en="CHOOSE YOUR FIGHTER" data-es="ELIGE A TU PELEADOR"></h2><div class="choices"><button id="jb" class="on" onclick="fighter('jace')">JACE COLTON 🇺🇸</button><button id="kb" onclick="fighter('kai')">KAI SURIYA 🇹🇭</button></div><div class="fighter"><div class="art" id="fighterArt"><div class="fallback" id="initial">JC</div><img id="portrait" src="jace_hero.webp" onerror="this.style.display='none'"></div><div class="card"><div class="tag" id="nation"></div><h2 id="name"></h2><div class="tag" id="style"></div><p id="bio"></p><div class="tag" data-en="SUPERNATURAL POWER" data-es="PODER SOBRENATURAL"></div><h3 id="power"></h3><div class="tag" data-en="TAP TO TRY ABILITIES" data-es="TOCA PARA PROBAR LAS HABILIDADES"></div><div class="moves" id="moves"></div><div class="meter"><div id="fill"></div></div><div id="message" class="note"></div></div></div><h3 data-en="CHARACTER POSTERS" data-es="PÓSTERS DEL PERSONAJE"></h3><div class="poster-grid" id="posters"></div><p class="note" data-en="Interactive ability previews are illustrative, not playable combat." data-es="Las habilidades interactivas son demostrativas; todavía no es un combate jugable."></p></section>
<section id="world" class="page"><div class="tag" data-en="WORLD ROSTER" data-es="PLANTEL MUNDIAL"></div><h2 data-en="24 FIGHTERS. 1 WORLD." data-es="24 PELEADORES. 1 MUNDO."></h2><p class="lead" data-en="Jace and Kai are the first two designed characters. Twenty-two more fighters are planned, each with their own martial art, story, and supernatural ability." data-es="Jace y Kai son los primeros dos personajes diseñados. Hay otros veintidós peleadores planeados, cada uno con su arte marcial, historia y poder sobrenatural."></p><div class="roster" id="roster"></div><p><button class="btn" onclick="go('join')" data-en="HELP BUILD IT →" data-es="AYÚDANOS A CREARLO →"></button></p></section>
<section id="join" class="page join"><div class="tag" data-en="YOU'RE INVITED" data-es="ESTÁS INVITADO"></div><h2 data-en="DANNY, WANT TO HELP MAKE THIS?" data-es="DANNY, ¿TE ANIMAS A CREARLO CON NOSOTROS?"></h2><p class="lead" data-en="We're just starting. The goal is to build the first playable fight: Jace versus Kai. You could be part of the team from the beginning." data-es="Apenas estamos empezando. La meta es crear la primera pelea jugable: Jace contra Kai. ¡Podrías ser parte del equipo desde el principio!"></p><div class="choices" style="display:block"><button onclick="role('test')" data-en="🎮 PLAYTEST — Tell us what feels fun" data-es="🎮 PROBAR — Dinos qué está divertido"></button><button onclick="role('ideas')" data-en="⚡ IDEAS — Invent powers and combos" data-es="⚡ IDEAS — Inventar poderes y combos"></button><button onclick="role('art')" data-en="🎨 CREATIVE — Help design fighters and arenas" data-es="🎨 CREATIVIDAD — Diseñar peleadores y arenas"></button></div><div id="feedback" class="feedback"></div><p><button class="btn" onclick="share()" data-en="SHARE MY CHOICE ↗" data-es="COMPARTIR MI ELECCIÓN ↗"></button></p></section>
</main><div class="nav"><button onclick="go('home')" data-en="HOME" data-es="INICIO"></button><button onclick="go('story')" data-en="STORY" data-es="HISTORIA"></button><button onclick="go('fighters')" data-en="FIGHTERS" data-es="PELEADORES"></button><button onclick="go('world')" data-en="ROSTER" data-es="PLANTEL"></button><button onclick="go('join')" data-en="JOIN" data-es="UNIRME"></button></div>
<script>
let lang='en',who='jace',energy=0,choice='';const F={jace:{name:'JACE COLTON',country:['UNITED STATES','ESTADOS UNIDOS'],style:'MMA / DUTCH KICKBOXING / KRAV MAGA',bio:['An elite American MMA fighter and competitive weightlifter. A mysterious energy surge gave him the ability to amplify kinetic force. He enters the tournament to expose the Dominion.','Peleador estadounidense de MMA y levantador de pesas competitivo. Una descarga misteriosa le dio el poder de amplificar la energía cinética. Entra al torneo para desenmascarar al Dominion.'],power:['KINETIC OVERDRIVE','SOBRECARGA CINÉTICA'],moves:['IRON BARRAGE','SHOCKSTEP','TITAN PRESS'],fin:'GRAVITY BREAK',images:['jace_hero.webp','jace_action.webp','jace_close.webp']},kai:{name:'KAI SURIYA',country:['THAILAND','TAILANDIA'],style:'MUAY THAI',bio:['A Muay Thai fighter from Chiang Mai searching for his missing brother. Fire awakened inside him when the Veil fractured. His most powerful attack summons a blazing phoenix.','Peleador de Muay Thai de Chiang Mai que busca a su hermano desaparecido. El fuego despertó en su interior cuando el Velo se fracturó. Su ataque definitivo invoca un fénix ardiente.'],power:['FIRE MANIPULATION','CONTROL DEL FUEGO'],moves:['DRAGON ELBOW','INFERNO KNEE','PHOENIX RUSH'],fin:'PHOENIX JUDGMENT',images:['kai_hero.webp','kai_action.webp','kai_close.webp']}};
const names=['Mateus Silva','Jack Cross','Yumi Kage','Amara Okafor','Lukas Voss','Sofía Reyes','Arjun Rana','Elena Volkova','Li Wei','Zuri Ndlovu','Dante Rossi','Min-Ji Park','Rafael Costa','Nadia El-Masri','Erik Storm','Aisha Haddad','Tane Rangi','Isabel Cruz','Malik Dubois','Camila Torres','Hanna Björk','The Warden'];
function language(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[l]);document.getElementById('en').classList.toggle('on',l==='en');document.getElementById('es').classList.toggle('on',l==='es');render();if(!choice)document.getElementById('feedback').textContent=l==='es'?'Elige la parte que más te emocione. No necesitas experiencia.':'Choose what sounds most fun. No experience needed.'}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));window.scrollTo(0,0);location.hash=id}
function fighter(f){who=f;energy=0;document.getElementById('jb').classList.toggle('on',f==='jace');document.getElementById('kb').classList.toggle('on',f==='kai');render()}
function render(){const f=F[who],idx=lang==='es'?1:0;document.getElementById('name').textContent=f.name;document.getElementById('nation').textContent=f.country[idx];document.getElementById('style').textContent=f.style;document.getElementById('bio').textContent=f.bio[idx];document.getElementById('power').textContent=f.power[idx];document.getElementById('initial').textContent=who==='jace'?'JC':'KS';document.getElementById('fighterArt').classList.toggle('kai',who==='kai');const p=document.getElementById('portrait');p.style.display='block';p.src=f.images[0];document.getElementById('moves').innerHTML=f.moves.map((m,i)=>'<button onclick="attack('+i+')">'+m+'</button>').join('')+'<button onclick="finish()">★ '+f.fin+'</button>';document.getElementById('fill').style.width=energy+'%';document.getElementById('message').textContent=lang==='es'?'Toca las habilidades para llenar tu energía.':'Tap abilities to charge your energy.';document.getElementById('posters').innerHTML=f.images.map((x,i)=>'<div><img src="'+x+'" onerror="this.style.opacity=.08" alt="'+f.name+'"><small>'+(['FULL-BODY','FIGHT SCENE','CLOSE-UP'][i])+'</small></div>').join('')}
function attack(i){energy=Math.min(100,energy+34);document.getElementById('fill').style.width=energy+'%';document.getElementById('message').textContent=F[who].moves[i]+' · '+(energy===100?(lang==='es'?'¡LISTO EL REMATE!':'FINISHER READY!'):energy+'%')}
function finish(){if(energy<100){document.getElementById('message').textContent=lang==='es'?'¡Carga la barra primero!':'Charge the meter first!';return}energy=0;document.getElementById('fill').style.width='0%';document.getElementById('message').textContent='★ '+F[who].fin+'!'}
function role(c){choice=c;const v={test:['I want to playtest the game!','¡Quiero probar el juego!'],ideas:['I want to help invent powers and combos!','¡Quiero inventar poderes y combos!'],art:['I want to help design characters and arenas!','¡Quiero diseñar personajes y arenas!']};document.getElementById('feedback').textContent=v[c][lang==='es'?1:0]}
async function share(){const t=document.getElementById('feedback').textContent;if(navigator.share){try{await navigator.share({title:'SHATTERBOUND',text:t,url:location.href});return}catch(e){}}if(navigator.clipboard){await navigator.clipboard.writeText(t+' '+location.href);document.getElementById('feedback').textContent=lang==='es'?'¡Copiado! Pégalo en WhatsApp.':'Copied! Paste it in a message.'}}
document.getElementById('roster').innerHTML=names.map(n=>'<div class="card">◇<br>'+n+'<br><span style="color:#ae9b8b;font-size:10px">COMING SOON</span></div>').join('');language('en');go(['home','story','fighters','world','join'].includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script></body></html>
